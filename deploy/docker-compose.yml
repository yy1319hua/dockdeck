# ============================================================================
# DockDeck 部署模板（S9.3）——Hub / Agent 双角色，按 profile 择一启动。
#
#   Hub   控制面：Web UI、鉴权、审计、聚合。数据落命名卷，不碰 docker.sock。
#   Agent 每台被管主机一个：代理本机 Docker Engine，socket 以 :ro 挂载。
#
# 用法（在 deploy/ 目录下）：
#   cp .env.example .env            # 填 DD_BIND_IP（两个角色都必填）
#   Agent 机另备：install -m 600 /dev/null secrets/agent.token 后写入令牌
#   docker compose --profile hub   up -d     # Hub 机
#   docker compose --profile agent up -d     # Agent 机
#   docker compose --profile hub --profile agent up -d   # 单机双角色
#   docker compose --profile hub --profile agent config   # 自检（渲染+插值，不需守护进程）
#
# 设计要点与取舍（详见 docs/ARCHITECTURE.md「网络与暴露」与 `.github/workflows/ci.yml` 的发布流程）：
#   * network_mode: host + 应用层绑 IP——Hub 禁绑 0.0.0.0（config.Validate），
#     桥接网络里容器 IP 运行时分配、写不进启动参数；host 下 tailscale0 直接
#     可见，暴露面仍由应用自己的绑定白名单把守。故无 ports: 发布（host 模式下
#     ports 本就被忽略），端口绑定由 --listen ${DD_BIND_IP}:<端口> 完成。
#   * Agent 的 token 走 --token-file 文件挂载而非环境变量：docker inspect
#     看不到挂载文件内容；文件权限 600，路径在 .gitignore 内。
#   * socket 只读（:ro）；Agent 以 root 跑（socket 属主 root:docker），
#     边界 = :ro + 自我保护名单；Hub 非 root（uid 10000）且不挂 socket。
#   * 不带 --profile 启动 = 什么都不起（防误起）；容器名固定，Agent 的
#     --self-container 与 container_name 联动，「不动自己」跨重建稳定。
# ============================================================================

name: dockdeck

# 共享日志策略：json-file 轮转，10m × 3 份（容器日志不加限会把宿主磁盘吃满）
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hub:
    image: "${DD_HUB_IMAGE:-ghcr.io/yy1319hua/dockdeck-hub:latest}"
    container_name: dockdeck-hub
    profiles: ["hub"]
    network_mode: host
    environment:
      # 监听地址：默认取 DD_BIND_IP；可用 DD_HUB_BIND_IP 单独覆盖（如 0.0.0.0）。
      # 绑 0.0.0.0 必须同时设 DD_ALLOW_INSECURE_BIND=1，否则应用层硬拒。
      # 不填 compose 直接报错，不让错误的配置活到容器里。
      DD_LISTEN: "${DD_HUB_BIND_IP:-${DD_BIND_IP:?必填：在 deploy/.env 设置 DD_BIND_IP}}:8443"
      # TLS：self 自签（指纹见设置页）| none 明文（仅允许回环，反代场景）
      DD_TLS_MODE: "${DD_HUB_TLS_MODE:-self}"
      # 危险开关：允许 DD_LISTEN 绑 0.0.0.0（监听所有网卡）。默认空 = 拒绝。
      DD_ALLOW_INSECURE_BIND: "${DD_ALLOW_INSECURE_BIND:-}"
    volumes:
      # SQLite、主密钥、自签证书、整库备份都在这一个卷里；命名卷而非绑定
      # 宿目录——模板要可移植，也避免数据/密钥意外落进出仓库的路径。
      - dockdeck-hub-data:/data
    restart: unless-stopped
    logging: *logging

  agent:
    image: "${DD_AGENT_IMAGE:-ghcr.io/yy1319hua/dockdeck-agent:latest}"
    container_name: dockdeck-agent
    profiles: ["agent"]
    network_mode: host
    # command 覆盖镜像 CMD（exec 形式整体替换），故把镜像 CMD 的
    # --docker-socket 一并列出；--listen 无对应环境变量，只能走旗标。
    command:
      - --listen
      - "${DD_AGENT_BIND_IP:-${DD_BIND_IP:?必填：在 deploy/.env 设置 DD_BIND_IP}}:9527"
      - --docker-socket
      - /var/run/docker.sock
      # 与 container_name 联动：hostname 默认是容器短 ID（重建即变），
      # 固定名才能让 guard 的「不碰自身容器」跨重建稳定（双向前缀匹配）。
      - --self-container
      - "${DD_AGENT_SELF_CONTAINER:-dockdeck-agent}"
      # 令牌从文件读：内容不进环境变量（docker inspect 不可见）、不进命令行。
      - --token-file
      - /run/secrets/agent.token
      # Compose 白名单目录（递归扫描其内的 compose 文件）。
      # 不配 → Agent 的 ComposeDirs 为空 → 面板 Compose 页恒为空列表。
      - --compose-dirs
      - "${DD_AGENT_COMPOSE_DIRS:-${DD_COMPOSE_DIRS:-/opt/dockdeck/dockdeck/deploy}}"
      # 文件管理根白名单（逗号分隔；留空 = 该模块不注册路由，面板报未启用）。
      # 必须是「容器内」可见路径：下方 volumes 已把宿主 /opt/dockdeck 同路径挂入。
      - --fs-root
      - "${DD_AGENT_FS_ROOTS:-${DD_FS_ROOTS:-/opt/dockdeck}}"
    volumes:
      # 只读挂载 Engine socket：Agent 只需要读+发命令，:ro 是第二道边界
      # （第一道是应用侧自我保护名单）。Hub 不挂 socket。
      # create_host_path: false——宿主机没有 socket 就启动失败，而不是被
      # docker 悄悄建个目录/空文件顶替（那是把配置错误藏成运行期怪事）。
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      # 宿主机 ./secrets/agent.token（相对本文件目录，权限 600）→ 容器内只读。
      # 同样不代建：文件没备好就当场失败（见 README 第 2 步）。
      - type: bind
        source: ./secrets/agent.token
        target: /run/secrets/agent.token
        read_only: true
        bind:
          create_host_path: false
      # 文件管理与 Compose 读写需要看到宿主目录：同路径 bind 挂载，
      # 面板里展示/操作的路径即宿主真实路径。范围刻意锁在 /opt/dockdeck，
      # 不挂 / ——面板可写，挂根等于把整机文件面暴露给 Web 会话。
      - type: bind
        source: /opt/dockdeck
        target: /opt/dockdeck
        bind:
          create_host_path: false
    restart: unless-stopped
    logging: *logging
    # 启动时向 Hub 自注册纳管（S5.8）：在 .env 填 DD_HUB_URL / DD_AGENT_JOIN_SECRET
    # 即生效，留空 = 不自注册（应用判空关闭）。给空默认值而非整块注释，是为了让
    # install-agent.sh 只管写 .env，不必再回来改 compose（S10.1）。
    environment:
      DD_HUB_URL: "${DD_HUB_URL:-}"
      DD_AGENT_JOIN_SECRET: "${DD_AGENT_JOIN_SECRET:-}"
      # 反向模式：1 = 不监听端口，主动连 Hub（NAT 后可用）。留空 = 正常监听。
      DD_AGENT_REVERSE: "${DD_AGENT_REVERSE:-}"
      # 磁盘挂载点白名单（逗号分隔）。留空 = 自动探测常见挂载点。
      DD_AGENT_DISK_MOUNTS: "${DD_AGENT_DISK_MOUNTS:-}"


  # Cloudflare Tunnel 出口：把面板暴露到公网而不开任何入站端口。
  # cloudflared 是出站连接，宿主机只需能访问外网 443。
  # network_mode: host —— 要直连 Hub 绑定的 ${DD_BIND_IP}:8443
  # （Hub 不监听回环，容器默认 bridge 网络到不了该地址）。
  # ⚠️ token 走 .env（已 gitignore）注入，绝不写死在本文件——本文件入库。
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: dockdeck-tunnel
    profiles: ["tunnel"]
    network_mode: host
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - "${DD_TUNNEL_TOKEN:?必填：在 deploy/.env 设置 DD_TUNNEL_TOKEN（Cloudflare Zero Trust → Networks → Tunnels 创建后获得）}"
    restart: unless-stopped
    logging: *logging
volumes:
  dockdeck-hub-data:
